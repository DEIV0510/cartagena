<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Sitio en mantenimiento</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100svh;display:grid;place-items:center;text-align:center;padding:28px;color:#fff;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,106,44,.35), transparent 55%),
      radial-gradient(120% 90% at 80% 120%, rgba(31,209,201,.30), transparent 55%),
      linear-gradient(160deg,#241b52 0%,#1e1b39 60%,#160f33 100%);
  }
  .card{max-width:480px;width:100%}
  .badge{width:74px;height:74px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;
    font-size:2.1rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
  h1{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
  p{margin:14px auto 0;font-size:1rem;line-height:1.6;color:rgba(255,255,255,.85);max-width:34em}
  .chip{display:inline-block;margin-top:22px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:#ffd36b;background:rgba(255,211,107,.12);border:1px solid rgba(255,211,107,.3);padding:7px 14px;border-radius:999px}
  .foot{margin-top:30px;font-size:.8rem;color:rgba(255,255,255,.55)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1fd1c9;margin-right:7px;
    box-shadow:0 0 0 0 rgba(31,209,201,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,209,201,.55)}70%{box-shadow:0 0 0 12px rgba(31,209,201,0)}100%{box-shadow:0 0 0 0 rgba(31,209,201,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="badge">🛠️</div>
    <h1>Sitio en mantenimiento</h1>
    <p>Estamos realizando ajustes para mejorar tu experiencia. Esta página volverá a estar disponible muy pronto.</p>
    <span class="chip"><span class="dot"></span>Temporalmente fuera de servicio</span>
    <div class="foot">Gracias por tu paciencia.</div>
  </main>
</body>
</html>
